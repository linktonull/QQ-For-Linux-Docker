name: build-qq-image
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Custom tag"
        required: false
        default: ""
      image_name:
        description: "qq debian image name"
        required: false
        default: ""
env:
  IMAGE_NAME: ${{ inputs.image_name || 'qq' }}
  IMAGE_TAGS: latest
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Download debian
      run: |
        chmod +x ./download.sh
        ./download.sh

    - name: Buildah Action
      id: build_image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: ${{ env.AUTO_TAG }}
        containerfiles: |
          ./Dockerfile

    - name: Push To GHCR
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37
      id: push
      with:
        image: ${{ steps.build_image.outputs.image }}
        tags: ${{ steps.build_image.outputs.tags }}
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ env.REGISTRY_USER }}
        password: ${{ env.REGISTRY_PASSWORD }}
        extra-args: |
          --disable-content-trust

    - name: Print image url
      run: echo "Image pushed to ${{ steps.push.outputs.registry-paths }}"
